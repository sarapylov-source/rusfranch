<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 660" role="img" aria-labelledby="title desc"><title id="title">Продажи и работа с базой в БИОРАЙЗ</title><desc id="desc">Первичная проверка заявки, менеджер полного цикла и договор. Отдельный квалификатор тестируется. Сегментированная база получает письма, SMS и приглашения на вебинары.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 1L8 5L0 9" fill="none" stroke="#F24822" stroke-width="2"/></marker></defs><rect width="1040" height="660" rx="24" fill="#F2E0D5"/><g font-family="Arial, sans-serif" fill="#0D0D0D"><text x="40" y="55.0" font-size="31" font-weight="700" fill="#0D0D0D">ОДИН МЕНЕДЖЕР ВЕДЁТ СДЕЛКУ</text><text x="40" y="92.0" font-size="22" font-weight="400" fill="#6E5E56">Схема по рассказу Романа Культина</text><rect x="40" y="138" width="222" height="227" rx="20" fill="#FFFFFF" stroke="#DDBFB0" stroke-width="1.5"/><text x="61" y="177.0" font-size="22" font-weight="700" fill="#F24822">01</text><text x="61" y="220" font-size="24" font-weight="700" fill="#0D0D0D">Входящая</text><text x="61" y="250" font-size="24" font-weight="700" fill="#0D0D0D">заявка</text><text x="61" y="304" font-size="18" font-weight="400" fill="#0D0D0D">Интерес к франшизе</text><rect x="294" y="138" width="222" height="227" rx="20" fill="#FFFFFF" stroke="#DDBFB0" stroke-width="1.5"/><text x="315" y="177.0" font-size="22" font-weight="700" fill="#F24822">02</text><text x="315" y="220" font-size="24" font-weight="700" fill="#0D0D0D">Первичная</text><text x="315" y="250" font-size="24" font-weight="700" fill="#0D0D0D">проверка*</text><text x="315" y="304" font-size="18" font-weight="400" fill="#0D0D0D">Деньги и готовность</text><text x="315" y="330" font-size="18" font-weight="400" fill="#0D0D0D">к разговору</text><rect x="548" y="138" width="222" height="227" rx="20" fill="#FFFFFF" stroke="#DDBFB0" stroke-width="1.5"/><text x="569" y="177.0" font-size="22" font-weight="700" fill="#F24822">03</text><text x="569" y="220" font-size="24" font-weight="700" fill="#0D0D0D">Менеджер</text><text x="569" y="250" font-size="24" font-weight="700" fill="#0D0D0D">полного цикла</text><text x="569" y="304" font-size="18" font-weight="400" fill="#0D0D0D">Рынок, финмодель,</text><text x="569" y="330" font-size="18" font-weight="400" fill="#0D0D0D">маркетинг, условия</text><rect x="802" y="138" width="222" height="227" rx="20" fill="#FFFFFF" stroke="#DDBFB0" stroke-width="1.5"/><text x="823" y="177.0" font-size="22" font-weight="700" fill="#F24822">04</text><text x="823" y="220" font-size="24" font-weight="700" fill="#0D0D0D">Договор</text><text x="823" y="304" font-size="18" font-weight="400" fill="#0D0D0D">Завершение сделки</text><path d="M265 246h24" stroke="#F24822" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M519 246h24" stroke="#F24822" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M773 246h24" stroke="#F24822" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="40" y="402.0" font-size="21" font-weight="400" fill="#6E5E56">* Отдельный квалификатор — подход, который команда тестирует.</text><rect x="40" y="444" width="984" height="171" rx="20" fill="#0D0D0D" stroke="#DDBFB0" stroke-width="1.5"/><text x="66" y="487.0" font-size="25" font-weight="700" fill="#FFFFFF">РАБОТА С ТЕМИ, КТО ПОКА НЕ КУПИЛ</text><text x="66" y="539.0" font-size="23" font-weight="700" fill="#FFFFFF">Сегментация базы</text><text x="400" y="539.0" font-size="23" font-weight="700" fill="#FFFFFF">Письма · SMS · вебинары</text><text x="66" y="578.0" font-size="22" font-weight="400" fill="#F2E0D5">Возвращают человека в разговор, когда появляется готовность.</text><path d="M310 532h57" stroke="#F24822" stroke-width="3" fill="none" marker-end="url(#arrow)"/></g></svg>