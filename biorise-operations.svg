<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 650" role="img" aria-labelledby="title desc"><title id="title">Кто за что отвечает в БИОРАЙЗ</title><desc id="desc">УК организует запуск и поддержку, партнёр управляет клиникой на месте. Работа продолжается через отчётность и обратную связь.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 1L8 5L0 9" fill="none" stroke="#F24822" stroke-width="2"/></marker></defs><rect width="1040" height="650" rx="24" fill="#F2E0D5"/><g font-family="Arial, sans-serif" fill="#0D0D0D"><text x="40" y="57.0" font-size="32" font-weight="700" fill="#0D0D0D">ЗАПУСК И СОПРОВОЖДЕНИЕ</text><text x="40" y="94.0" font-size="21" font-weight="400" fill="#6E5E56">Роли по материалам онлайн-экскурсии 17 ноября 2026</text><rect x="40" y="130" width="460" height="320" rx="20" fill="#FFFFFF" stroke="#DDBFB0" stroke-width="1.5"/><rect x="540" y="130" width="460" height="320" rx="20" fill="#FFFFFF" stroke="#DDBFB0" stroke-width="1.5"/><text x="68" y="174" font-size="26" font-weight="700" fill="#F24822">УПРАВЛЯЮЩАЯ</text><text x="68" y="205" font-size="26" font-weight="700" fill="#F24822">КОМПАНИЯ</text><text x="68" y="253" font-size="22" font-weight="400" fill="#0D0D0D">Помещение и организация запуска</text><text x="68" y="298" font-size="22" font-weight="400" fill="#0D0D0D">Подбор и обучение команды</text><text x="68" y="343" font-size="22" font-weight="400" fill="#0D0D0D">Методика и стандарты</text><text x="68" y="388" font-size="22" font-weight="400" fill="#0D0D0D">Поддержка и разбор результатов</text><text x="568" y="174" font-size="26" font-weight="700" fill="#F24822">ПАРТНЁР</text><text x="568" y="205" font-size="26" font-weight="700" fill="#F24822">В КЛИНИКЕ</text><text x="568" y="253" font-size="22" font-weight="400" fill="#0D0D0D">Операционные вопросы на месте</text><text x="568" y="298" font-size="22" font-weight="400" fill="#0D0D0D">Договоры и закупка расходников</text><text x="568" y="343" font-size="22" font-weight="400" fill="#0D0D0D">Организация работы клиники</text><text x="568" y="388" font-size="22" font-weight="400" fill="#0D0D0D">Выполнение согласованных задач</text><path d="M270 454V485" stroke="#F24822" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M770 454V485" stroke="#F24822" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="40" y="500" width="960" height="112" rx="20" fill="#0D0D0D" stroke="#DDBFB0" stroke-width="1.5"/><text x="68" y="541.0" font-size="25" font-weight="700" fill="#FFFFFF">ОБЩАЯ РАБОТА С РЕЗУЛЬТАТОМ</text><text x="68" y="580.0" font-size="22" font-weight="400" fill="#F2E0D5">P&amp;L · маркетинговые отчёты · ежедневные данные · обратная связь</text></g></svg>