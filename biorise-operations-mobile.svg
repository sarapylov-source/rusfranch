<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1120" role="img" aria-labelledby="title desc"><title id="title">Кто за что отвечает в БИОРАЙЗ</title><desc id="desc">Те же роли УК и партнёра, в вертикальной схеме для телефона.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 1L8 5L0 9" fill="none" stroke="#F24822" stroke-width="2"/></marker></defs><rect width="640" height="1120" rx="24" fill="#F2E0D5"/><g font-family="Arial, sans-serif" fill="#0D0D0D"><text x="28" y="57" font-size="33" font-weight="700" fill="#0D0D0D">ЗАПУСК И</text><text x="28" y="96" font-size="33" font-weight="700" fill="#0D0D0D">СОПРОВОЖДЕНИЕ</text><rect x="24" y="133" width="592" height="306" rx="20" fill="#FFFFFF" stroke="#DDBFB0" stroke-width="1.5"/><text x="51" y="181" font-size="30" font-weight="700" fill="#F24822">УПРАВЛЯЮЩАЯ</text><text x="51" y="217" font-size="30" font-weight="700" fill="#F24822">КОМПАНИЯ</text><text x="51" y="270" font-size="27" font-weight="400" fill="#0D0D0D">Помещение и организация запуска</text><text x="51" y="313" font-size="27" font-weight="400" fill="#0D0D0D">Подбор и обучение команды</text><text x="51" y="356" font-size="27" font-weight="400" fill="#0D0D0D">Методика и стандарты</text><text x="51" y="399" font-size="27" font-weight="400" fill="#0D0D0D">Поддержка и разбор результатов</text><path d="M320 446V476" stroke="#F24822" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="24" y="493" width="592" height="300" rx="20" fill="#FFFFFF" stroke="#DDBFB0" stroke-width="1.5"/><text x="51" y="543" font-size="30" font-weight="700" fill="#F24822">ПАРТНЁР</text><text x="51" y="579" font-size="30" font-weight="700" fill="#F24822">В КЛИНИКЕ</text><text x="51" y="631" font-size="27" font-weight="400" fill="#0D0D0D">Операционные вопросы на месте</text><text x="51" y="674" font-size="27" font-weight="400" fill="#0D0D0D">Договоры и закупка расходников</text><text x="51" y="717" font-size="27" font-weight="400" fill="#0D0D0D">Организация работы клиники</text><text x="51" y="760" font-size="27" font-weight="400" fill="#0D0D0D">Выполнение согласованных задач</text><path d="M320 801V833" stroke="#F24822" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="24" y="851" width="592" height="225" rx="20" fill="#0D0D0D" stroke="#DDBFB0" stroke-width="1.5"/><text x="51" y="901" font-size="29" font-weight="700" fill="#FFFFFF">ОБЩАЯ РАБОТА</text><text x="51" y="937" font-size="29" font-weight="700" fill="#FFFFFF">С РЕЗУЛЬТАТОМ</text><text x="51" y="994" font-size="27" font-weight="400" fill="#F2E0D5">P&amp;L и маркетинговые отчёты</text><text x="51" y="1036" font-size="27" font-weight="400" fill="#F2E0D5">Ежедневные данные и обратная связь</text></g></svg>