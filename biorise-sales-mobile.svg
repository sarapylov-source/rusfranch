<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1360" role="img" aria-labelledby="title desc"><title id="title">Продажи и работа с базой в БИОРАЙЗ</title><desc id="desc">Вертикальная схема: заявка, проверка, менеджер полного цикла, договор. Отдельный квалификатор — тестируемый подход. Письма, SMS и вебинары помогают возвращать базу в диалог.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 1L8 5L0 9" fill="none" stroke="#F24822" stroke-width="2"/></marker></defs><rect width="640" height="1360" rx="24" fill="#F2E0D5"/><g font-family="Arial, sans-serif" fill="#0D0D0D"><text x="28" y="55" font-size="33" font-weight="700" fill="#0D0D0D">ОДИН МЕНЕДЖЕР</text><text x="28" y="95" font-size="33" font-weight="700" fill="#0D0D0D">ВЕДЁТ СДЕЛКУ</text><rect x="24" y="134" width="592" height="152" rx="20" fill="#FFFFFF" stroke="#DDBFB0" stroke-width="1.5"/><text x="49" y="174.0" font-size="25" font-weight="700" fill="#F24822">01</text><text x="108" y="176.0" font-size="28" font-weight="700" fill="#0D0D0D">Входящая заявка</text><text x="49" y="239.0" font-size="26" font-weight="400" fill="#0D0D0D">Интерес к франшизе</text><path d="M320 292v25" stroke="#F24822" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="24" y="325" width="592" height="152" rx="20" fill="#FFFFFF" stroke="#DDBFB0" stroke-width="1.5"/><text x="49" y="365.0" font-size="25" font-weight="700" fill="#F24822">02</text><text x="108" y="367.0" font-size="28" font-weight="700" fill="#0D0D0D">Первичная проверка*</text><text x="49" y="430.0" font-size="26" font-weight="400" fill="#0D0D0D">Деньги и готовность к разговору</text><path d="M320 483v25" stroke="#F24822" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="24" y="516" width="592" height="152" rx="20" fill="#FFFFFF" stroke="#DDBFB0" stroke-width="1.5"/><text x="49" y="556.0" font-size="25" font-weight="700" fill="#F24822">03</text><text x="108" y="558.0" font-size="28" font-weight="700" fill="#0D0D0D">Менеджер полного цикла</text><text x="49" y="621.0" font-size="26" font-weight="400" fill="#0D0D0D">Рынок, финмодель, маркетинг, условия</text><path d="M320 674v25" stroke="#F24822" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="24" y="707" width="592" height="152" rx="20" fill="#FFFFFF" stroke="#DDBFB0" stroke-width="1.5"/><text x="49" y="747.0" font-size="25" font-weight="700" fill="#F24822">04</text><text x="108" y="749.0" font-size="28" font-weight="700" fill="#0D0D0D">Договор</text><text x="49" y="812.0" font-size="26" font-weight="400" fill="#0D0D0D">Завершение сделки</text><text x="28" y="909" font-size="25" font-weight="400" fill="#6E5E56">* Отдельный квалификатор — подход,</text><text x="28" y="943" font-size="25" font-weight="400" fill="#6E5E56">который команда тестирует.</text><rect x="24" y="1002" width="592" height="304" rx="20" fill="#0D0D0D" stroke="#DDBFB0" stroke-width="1.5"/><text x="49" y="1048" font-size="29" font-weight="700" fill="#FFFFFF">ЕСЛИ ЧЕЛОВЕК</text><text x="49" y="1084" font-size="29" font-weight="700" fill="#FFFFFF">ПОКА НЕ КУПИЛ</text><text x="49" y="1148" font-size="27" font-weight="400" fill="#F2E0D5">Сегментированная база</text><text x="49" y="1196" font-size="27" font-weight="400" fill="#F2E0D5">Письма, SMS и вебинары</text><text x="49" y="1244" font-size="27" font-weight="400" fill="#F2E0D5">Возврат в разговор о франшизе</text></g></svg>